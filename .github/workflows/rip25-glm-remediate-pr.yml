name: RIP-25 GLM remediation via internal PR

on:
  pull_request:
    branches:
      - integration/rip25-v4.8.0

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'fix/rip25-v48-glm-remediation'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rip25-v48-glm-remediation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and materialize approved architecture
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 94c3369b647799bc53f23e570feb303722ce7f06 HEAD
          chmod +x contrib/devtools/apply-rip25-v48-port-v4.sh
          ./contrib/devtools/apply-rip25-v48-port-v4.sh

      - name: Apply GLM remediations
        shell: bash
        run: |
          set -euo pipefail
          python3 contrib/devtools/remediate-glm-rip25-v48.py
          git diff --check
          chmod +x contrib/devtools/check-rip25-v48-invariants.sh
          ./contrib/devtools/check-rip25-v48-invariants.sh

          # Approved RIP-25 architecture must remain unchanged.
          grep -Fq 'vDeployments[Consensus::DEPLOYMENT_PQ_HYBRID].bit = 12' src/chainparams.cpp
          grep -Fq 'MAX_BLOCK_WEIGHT_RIP25_PHASE1 = 12000000' src/consensus/consensus.h
          grep -Fq 'MAX_BLOCK_WEIGHT_RIP25_PHASE2 = 16000000' src/consensus/consensus.h
          grep -Fq 'PQ_WITNESS_SCALE_FACTOR = 8' src/consensus/consensus.h
          grep -Fq 'VersionBitsStateSinceHeight' src/validation.cpp
          grep -Fq 'SCRIPT_VERIFY_PQ_HYBRID' src/validation.cpp

      - name: Commit reviewed remediation and remove bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch -- \
            .glm-remediation-trigger \
            .github/workflows/rip25-glm-remediation.yml \
            .github/workflows/rip25-glm-remediate-once.yml \
            .github/workflows/rip25-glm-remediate-pr.yml \
            contrib/devtools/remediate-glm-rip25-v48.py

          git add -- \
            src/validation.cpp \
            configure.ac \
            src/miner.cpp \
            src/init.cpp \
            src/validation.h \
            src/wallet/rpcwallet.cpp \
            src/Makefile.am \
            doc/RIP-0025-PQ-Signatures.md \
            src/policy/policy.cpp \
            src/wallet/wallet.cpp \
            src/crypto/mldsa.cpp \
            src/Makefile.test.include \
            src/chainparams.cpp \
            contrib/devtools/check-rip25-v48-invariants.sh \
            .github/workflows/rip25-v48-final-gate.yml \
            .github/workflows/build-raven.yml

          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git status --short
          git commit -m 'security: remediate GLM RIP-25 v4.8 audit findings'
          git push origin HEAD:fix/rip25-v48-glm-remediation
