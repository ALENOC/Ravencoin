name: Temporary RIP-25 integration bootstrap

on:
  pull_request:
    types: [reopened]
    branches: [master]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'integration/rip25-v4.8.0'
    runs-on: ubuntu-22.04
    steps:
      - name: Verify integration trigger
        run: |
          echo "RIP-25 v4.8 integration bootstrap is active"
          echo "head=${GITHUB_HEAD_REF} base=${GITHUB_BASE_REF}"
