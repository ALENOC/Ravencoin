name: RIP-25 v4.8 Final Gate

on:
  push:
    branches:
      - integration/rip25-v4.8.0
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rip25-v48-final-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEJOBS: -j2

jobs:
  security-tests:
    name: PQ + v4.8 security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: prereqs
        name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autotools-dev bsdmainutils build-essential ca-certificates \
            cmake curl git libtool pkg-config python3 ninja-build

      - id: materialize
        name: Materialize audited RIP-25 port
        run: |
          chmod +x contrib/devtools/apply-rip25-v48-port-v4.sh
          ./contrib/devtools/apply-rip25-v48-port-v4.sh

      - id: invariants
        name: Verify security and consensus invariants
        run: |
          chmod +x contrib/devtools/check-rip25-v48-invariants.sh
          ./contrib/devtools/check-rip25-v48-invariants.sh

      - id: depends
        name: Build pinned dependencies
        run: make -C depends $MAKEJOBS HOST=x86_64-pc-linux-gnu NO_QT=1

      - id: configure
        name: Configure Linux test build
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" \
            ./configure --without-gui --disable-bench

      - id: build_tests
        name: Build tests
        run: make $MAKEJOBS

      - id: unit_tests
        name: Run unit and regression tests
        run: make check

      - name: Publish security gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          PREREQS: ${{ steps.prereqs.outcome }}
          MATERIALIZE: ${{ steps.materialize.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          DEPENDS: ${{ steps.depends.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD_TESTS: ${{ steps.build_tests.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
        shell: bash
        run: |
          state=success
          context="rip25-final/security-tests"
          description="security-tests passed"
          for pair in \
            "checkout:$CHECKOUT" \
            "prereqs:$PREREQS" \
            "materialize:$MATERIALIZE" \
            "invariants:$INVARIANTS" \
            "depends:$DEPENDS" \
            "configure:$CONFIGURE" \
            "build-tests:$BUILD_TESTS" \
            "unit-tests:$UNIT_TESTS"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [[ "$outcome" == "failure" || "$outcome" == "cancelled" ]]; then
              state=failure
              context="rip25-final/security-tests/$name"
              description="failure: $name"
              break
            fi
          done
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"

  build:
    name: build (${{ matrix.name }})
    needs: security-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32v7-disable-wallet
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf
            configure_flags: --without-gui --disable-wallet --disable-bench
            run_tests: false
          - name: arm32v7
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf
            configure_flags: --without-gui --disable-bench
            run_tests: false
          - name: linux-disable-wallet
            host: x86_64-pc-linux-gnu
            packages: ''
            configure_flags: --without-gui --disable-wallet --disable-bench
            run_tests: true
          - name: linux
            host: x86_64-pc-linux-gnu
            packages: ''
            configure_flags: --without-gui --disable-bench
            run_tests: true
          - name: windows
            host: x86_64-w64-mingw32
            packages: g++-mingw-w64-x86-64
            configure_flags: --without-gui --disable-bench
            run_tests: false

    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: prereqs
        name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autotools-dev bsdmainutils build-essential ca-certificates \
            cmake curl git libtool pkg-config python3 ninja-build \
            ${{ matrix.packages }}

      - id: materialize
        name: Materialize audited RIP-25 port
        shell: bash
        run: |
          chmod +x contrib/devtools/apply-rip25-v48-port-v4.sh
          ./contrib/devtools/apply-rip25-v48-port-v4.sh

      - id: invariants
        name: Verify security and consensus invariants
        shell: bash
        run: |
          chmod +x contrib/devtools/check-rip25-v48-invariants.sh
          ./contrib/devtools/check-rip25-v48-invariants.sh

      - id: depends
        name: Build pinned dependencies
        shell: bash
        run: make -C depends $MAKEJOBS HOST=${{ matrix.host }} NO_QT=1

      - id: configure
        name: Configure
        shell: bash
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${{ matrix.host }}/share/config.site" \
            ./configure ${{ matrix.configure_flags }}

      - id: build
        name: Build
        shell: bash
        run: make $MAKEJOBS

      - id: native_tests
        name: Run native tests
        if: matrix.run_tests
        shell: bash
        run: make check

      - name: Publish build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          PREREQS: ${{ steps.prereqs.outcome }}
          MATERIALIZE: ${{ steps.materialize.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          DEPENDS: ${{ steps.depends.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NATIVE_TESTS: ${{ steps.native_tests.outcome }}
          TARGET: ${{ matrix.name }}
        shell: bash
        run: |
          state=success
          context="rip25-final/$TARGET"
          description="$TARGET passed"
          for pair in \
            "checkout:$CHECKOUT" \
            "prereqs:$PREREQS" \
            "materialize:$MATERIALIZE" \
            "invariants:$INVARIANTS" \
            "depends:$DEPENDS" \
            "configure:$CONFIGURE" \
            "build:$BUILD" \
            "native-tests:$NATIVE_TESTS"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [[ "$outcome" == "failure" || "$outcome" == "cancelled" ]]; then
              state=failure
              context="rip25-final/$TARGET/$name"
              description="failure: $name"
              break
            fi
          done
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
