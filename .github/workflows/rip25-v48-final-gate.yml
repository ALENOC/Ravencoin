name: RIP-25 v4.8 Final Gate

on:
  push:
    branches:
      - integration/rip25-v4.8.0
      - fix/rip25-v48-glm-remediation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rip25-v48-final-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEJOBS: -j2

jobs:
  security-tests:
    name: PQ + v4.8 security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: source_integrity
        name: Verify checked-out commit is pristine
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - id: prereqs
        name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autotools-dev bsdmainutils build-essential ca-certificates \
            cmake curl git libtool pkg-config python3 ninja-build

      - id: invariants
        name: Lint security and consensus invariants
        shell: bash
        run: ./contrib/devtools/check-rip25-v48-invariants.sh --structural-only

      - id: depends
        name: Build pinned dependencies
        shell: bash
        run: make -C depends $MAKEJOBS HOST=x86_64-pc-linux-gnu NO_QT=1

      - id: prebuild_integrity
        name: Verify tracked source remains unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - id: configure
        name: Configure Linux test build
        run: |
          ./autogen.sh
          mkdir -p "$HOME/.ccache"
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" \
            ./configure --without-gui --disable-bench

      - id: build_tests
        name: Build tests
        run: make $MAKEJOBS

      - id: unit_tests
        name: Run unit and regression tests
        run: make check

      - id: behavioral_invariants
        name: Verify behavioral security invariants
        shell: bash
        run: ./contrib/devtools/check-rip25-v48-invariants.sh --run-tests

  build:
    name: build (${{ matrix.name }})
    needs: security-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32v7-disable-wallet
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf
            configure_flags: --without-gui --disable-wallet --disable-bench
            run_tests: false
          - name: arm32v7
            host: arm-linux-gnueabihf
            packages: g++-arm-linux-gnueabihf
            configure_flags: --without-gui --disable-bench
            run_tests: false
          - name: linux-disable-wallet
            host: x86_64-pc-linux-gnu
            packages: ''
            configure_flags: --without-gui --disable-wallet --disable-bench
            run_tests: true
          - name: linux
            host: x86_64-pc-linux-gnu
            packages: ''
            configure_flags: --without-gui --disable-bench
            run_tests: true
          - name: windows
            host: x86_64-w64-mingw32
            packages: g++-mingw-w64-x86-64
            configure_flags: --without-gui --disable-bench
            run_tests: false

    steps:
      - id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: source_integrity
        name: Verify checked-out commit is pristine
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - id: prereqs
        name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake autotools-dev bsdmainutils build-essential ca-certificates \
            cmake curl git libtool pkg-config python3 ninja-build \
            ${{ matrix.packages }}
          if [ "${{ matrix.host }}" = "x86_64-w64-mingw32" ]; then
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi

      - id: invariants
        name: Lint security and consensus invariants
        shell: bash
        run: ./contrib/devtools/check-rip25-v48-invariants.sh --structural-only

      - id: depends
        name: Build pinned dependencies
        shell: bash
        run: make -C depends $MAKEJOBS HOST=${{ matrix.host }} NO_QT=1

      - id: prebuild_integrity
        name: Verify tracked source remains unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - id: configure
        name: Configure
        shell: bash
        run: |
          ./autogen.sh
          mkdir -p "$HOME/.ccache"
          CONFIG_SITE="$PWD/depends/${{ matrix.host }}/share/config.site" \
            ./configure ${{ matrix.configure_flags }}

      - id: build
        name: Build
        shell: bash
        run: make $MAKEJOBS

      - id: native_tests
        name: Run native tests
        if: matrix.run_tests
        shell: bash
        run: make check
