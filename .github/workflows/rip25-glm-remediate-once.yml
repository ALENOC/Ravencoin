name: RIP-25 GLM remediation bootstrap

on:
  push:
    branches:
      - fix/rip25-v48-glm-remediation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rip25-v48-glm-remediation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/rip25-v48-glm-remediation"
          test "$(git rev-parse HEAD^)" = "94c3369b647799bc53f23e570feb303722ce7f06"
          test -z "$(git status --porcelain)"

      - name: Commit the already-approved RIP-25 v4.8 postimage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x contrib/devtools/apply-rip25-v48-port-v4.sh
          ./contrib/devtools/apply-rip25-v48-port-v4.sh

      - name: Apply GLM security remediation without changing RIP-25 architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"{path}: expected text not found")
              p.write_text(s.replace(old, new, 1))

          # RVN-GLM-002: pre-activation wallet/relay policy must not create or
          # relay unprotected witness-v2 outputs. Consensus activation remains
          # the approved BIP9 versionbits design; old nodes still retain the
          # normal unknown-witness soft-fork semantics.
          p = Path('src/validation.cpp')
          s = p.read_text()
          old = '''    if (!gArgs.GetBoolArg("-prematurewitness", false) && tx.HasWitness() && !witnessEnabled) {
              return state.DoS(0, false, REJECT_NONSTANDARD, "no-witness-yet", true);
          }

          // Rather not work on nonstandard transactions (unless -testnet/-regtest)
          '''
          new = '''    if (!gArgs.GetBoolArg("-prematurewitness", false) && tx.HasWitness() && !witnessEnabled) {
              return state.DoS(0, false, REJECT_NONSTANDARD, "no-witness-yet", true);
          }

          // RIP-25: before BIP9 activation, witness-v2 outputs are deliberately
          // unknown-witness programs to legacy consensus and therefore must not
          // be relayed/mined by upgraded policy. This prevents users from placing
          // funds into an output that is not yet protected by ML-DSA validation.
          if (!pqEnabled) {
              for (const CTxOut& txout : tx.vout) {
                  int witnessVersion = -1;
                  std::vector<unsigned char> witnessProgram;
                  if (txout.scriptPubKey.IsWitnessProgram(witnessVersion, witnessProgram) &&
                      witnessVersion == 2 && witnessProgram.size() == 32) {
                      return state.DoS(0, false, REJECT_NONSTANDARD, "premature-pq-witness", true);
                  }
              }
          }

          // Rather not work on nonstandard transactions (unless -testnet/-regtest)
          '''
          if old not in s:
              raise SystemExit('validation.cpp: pre-activation policy insertion point not found')
          p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/policy/policy.cpp',
              '        return true; // RIP-25: PQ witness v2 outputs are always standard when solved',
              '        return true; // RIP-25: structurally standard; activation relay policy is enforced in validation.cpp')

          # RVN-GLM wallet HIGH: CCryptoKeyStore::AddPQKeyPubKey already invokes
          # the virtual AddCryptedPQKey path for encrypted+unlocked wallets.
          # Mirror legacy AddKeyPubKey: persist plaintext only for unencrypted wallets.
          replace_once(
              'src/wallet/wallet.cpp',
              '''    uint256 witnessProgram = pubkey.GetWitnessProgram();
              std::vector<unsigned char> keyData(key.GetKeyData().begin(), key.GetKeyData().end());
              return CWalletDB(*dbw).WritePQKey(witnessProgram, pubkey, keyData);
          }''',
              '''    if (!IsCrypted()) {
                  uint256 witnessProgram = pubkey.GetWitnessProgram();
                  std::vector<unsigned char> keyData(key.GetKeyData().begin(), key.GetKeyData().end());
                  return CWalletDB(*dbw).WritePQKey(witnessProgram, pubkey, keyData);
              }
              // For encrypted wallets CCryptoKeyStore::AddPQKeyPubKey has already
              // encrypted the secret and CWallet::AddCryptedPQKey persisted cpqkey.
              return true;
          }''')

          # RVN-GLM liboqs HIGH: sizes are not a sufficient compatibility check;
          # pre-0.12 ML-DSA was the IPD variant while 0.12 uses final FIPS 204.
          replace_once(
              'src/crypto/mldsa.cpp',
              '#include <oqs/oqs.h>\n',
              '''#include <oqs/oqs.h>

          #if !defined(OQS_VERSION_MAJOR) || !defined(OQS_VERSION_MINOR) || \\
              (OQS_VERSION_MAJOR == 0 && OQS_VERSION_MINOR < 12)
          #error "RIP-25 requires liboqs >= 0.12.0 (final FIPS 204 ML-DSA)"
          #endif
          ''')

          # Make both non-pkg-config fallback paths fail closed on liboqs < 0.12.
          p = Path('configure.ac')
          s = p.read_text()
          fallback = '[LIBOQS_LIBS=-loqs; AC_DEFINE([HAVE_LIBOQS], [1], [Define to 1 if liboqs is available])]'
          replacement = '''[LIBOQS_LIBS=-loqs
                  AC_EGREP_CPP([rip25_liboqs_0_12_or_newer],
                    [[#include <oqs/oqs.h>
          #if defined(OQS_VERSION_MAJOR) && defined(OQS_VERSION_MINOR) && \\
              (OQS_VERSION_MAJOR > 0 || OQS_VERSION_MINOR >= 12)
          rip25_liboqs_0_12_or_newer
          #endif]],
                    [AC_DEFINE([HAVE_LIBOQS], [1], [Define to 1 if liboqs is available])],
                    [AC_MSG_ERROR([RIP-25 requires liboqs >= 0.12.0 final FIPS 204; incompatible fallback library detected])])]'''
          if s.count(fallback) != 2:
              raise SystemExit(f'configure.ac: expected two fallback liboqs success actions, found {s.count(fallback)}')
          p.write_text(s.replace(fallback, replacement))

          # GLM test-gap finding: these suites existed but were not linked into make check.
          replace_once(
              'src/Makefile.test.include',
              '  test/kawpow_tests.cpp \\\n',
              '  test/kawpow_tests.cpp \\\n  test/kawpow_v48_hardening_tests.cpp \\\n')
          replace_once(
              'src/Makefile.test.include',
              '  test/versionbits_tests.cpp \\\n',
              '  test/versionbits_tests.cpp \\\n  test/rip25_versionbits_tests.cpp \\\n')

          # Keep the approved architecture exactly: bit 12, witness-v2 ML-DSA,
          # BIP9 activation and 8 -> 12 -> 16 MWU. Correct only the deployment
          # terminology: script enforcement is soft-fork-style, while raising a
          # block limit is a coordinated consensus-capacity change.
          replace_once(
              'doc/RIP-0025-PQ-Signatures.md',
              'The upgrade is deployed as a **soft fork** following the SegWit extensibility model. A phased block weight increase from 8 MWU to 16 MWU, combined with a PQ witness discount factor, ensures that network throughput remains adequate during and after migration.',
              'Witness-v2 ML-DSA enforcement is deployed using the **SegWit soft-fork extensibility model**. The separately approved phased block-weight expansion from 8 MWU to 12 MWU and then 16 MWU is a coordinated consensus-capacity change and therefore requires upgraded-node enforcement at the corresponding activation phases. The PQ witness discount factor and the approved phase values are unchanged.')
          replace_once(
              'src/chainparams.cpp',
              '// RIP-25: Post-Quantum Hybrid Signatures (ECDSA + ML-DSA-44)',
              '// RIP-25: ML-DSA-44 witness-v2 deployment (historical DEPLOYMENT_PQ_HYBRID enum name retained)')

          # RVN-GLM-001: CI must test the committed tree, never synthesize a
          # different consensus tree after checkout. Keep the legacy step id so
          # existing status publishing continues to report failures correctly.
          p = Path('.github/workflows/rip25-v48-final-gate.yml')
          s = p.read_text()
          s = s.replace(
              '''  push:
              branches:
                - integration/rip25-v4.8.0
            workflow_dispatch:
          ''',
              '''  push:
              branches:
                - integration/rip25-v4.8.0
                - fix/rip25-v48-glm-remediation
            pull_request:
              branches:
                - integration/rip25-v4.8.0
            workflow_dispatch:
          ''', 1)
          materializer = re.compile(
              r'\n      - id: materialize\n'
              r'        name: Materialize audited RIP-25 port\n'
              r'(?:        shell: bash\n)?'
              r'        run: \|\n'
              r'          chmod \+x contrib/devtools/apply-rip25-v48-port-v4\.sh\n'
              r'          \./contrib/devtools/apply-rip25-v48-port-v4\.sh\n')
          replacement_step = '''
              - id: materialize
                name: Verify committed source tree (no materialization)
                shell: bash
                run: |
                  set -euo pipefail
                  test -z "$(git status --porcelain)"
                  needle="apply-rip25-v48-port-v4"
                  if grep -Fq "${needle}.sh" .github/workflows/rip25-v48-final-gate.yml; then
                    echo "CI must not materialize or patch consensus source after checkout" >&2
                    exit 1
                  fi
                  git diff --exit-code
                  git diff --cached --exit-code
          '''
          s, n = materializer.subn(replacement_step, s)
          if n != 2:
              raise SystemExit(f'final gate: expected two materializer steps, replaced {n}')
          s = s.replace('uses: actions/checkout@v4', 'uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683')
          s = s.replace('            "materialize:$MATERIALIZE" \\\n', '            "source-integrity:$MATERIALIZE" \\\n')
          p.write_text(s)

          # Supply-chain hardening of the legacy manually-dispatched build workflow.
          p = Path('.github/workflows/build-raven.yml')
          s = p.read_text()
          s = s.replace('uses: fkirc/skip-duplicate-actions@master', 'uses: fkirc/skip-duplicate-actions@a09bf677ad5e5dedb31a42070b6a180fde0ab6ce')
          s = re.sub(r'uses: actions/checkout@v[0-9]+', 'uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683', s)
          s = s.replace('uses: actions/cache@v4', 'uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca')
          s = s.replace('uses: actions/upload-artifact@master', 'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a')
          p.write_text(s)

          # Extend the invariant checker so future CI fails if any GLM remediation
          # is accidentally reverted or if source materialization returns.
          p = Path('contrib/devtools/check-rip25-v48-invariants.sh')
          s = p.read_text()
          marker = "echo 'RIP-25/v4.8 invariants: OK'"
          extra = r'''
          # GLM remediation invariants: exact committed source must be release-ready.
          require_fixed 'premature-pq-witness' src/validation.cpp 'pre-activation PQ relay/output gate missing'
          require_fixed 'OQS_VERSION_MINOR' src/crypto/mldsa.cpp 'compile-time liboqs >=0.12 gate missing'
          require_fixed 'rip25_liboqs_0_12_or_newer' configure.ac 'fallback liboqs version gate missing'
          require_fixed 'test/rip25_versionbits_tests.cpp' src/Makefile.test.include 'RIP-25 versionbits tests are not wired into make check'
          require_fixed 'test/kawpow_v48_hardening_tests.cpp' src/Makefile.test.include '4.8 KAWPOW hardening tests are not wired into make check'
          if ! grep -A20 'bool CWallet::AddPQKeyPubKey' src/wallet/wallet.cpp | grep -Fq 'if (!IsCrypted())'; then
            fail 'encrypted wallet PQ key path can persist plaintext secret'
          fi
          reject_fixed 'Materialize audited RIP-25 port' .github/workflows/rip25-v48-final-gate.yml 'CI still materializes a different source tree'
          reject_fixed './contrib/devtools/apply-rip25-v48-port-v4.sh' .github/workflows/rip25-v48-final-gate.yml 'CI still executes the RIP-25 materializer'
          require_fixed 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' .github/workflows/rip25-v48-final-gate.yml 'security gate checkout action is not immutable-pinned'
          '''
          if marker not in s:
              raise SystemExit('invariant checker terminal marker not found')
          p.write_text(s.replace(marker, extra + '\n' + marker, 1))
          PY

      - name: Verify remediation invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          chmod +x contrib/devtools/check-rip25-v48-invariants.sh
          ./contrib/devtools/check-rip25-v48-invariants.sh
          grep -Fq 'SCRIPT_VERIFY_PQ_HYBRID' src/validation.cpp
          grep -Fq 'MAX_BLOCK_WEIGHT_RIP25_PHASE1 = 12000000' src/consensus/consensus.h
          grep -Fq 'MAX_BLOCK_WEIGHT_RIP25_PHASE2 = 16000000' src/consensus/consensus.h
          grep -Fq 'PQ_WITNESS_SCALE_FACTOR = 8' src/consensus/consensus.h
          grep -Fq 'vDeployments[Consensus::DEPLOYMENT_PQ_HYBRID].bit = 12' src/chainparams.cpp

      - name: Commit only reviewed remediation paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- .github/workflows/rip25-glm-remediate-once.yml
          git add -- \
            src/validation.cpp \
            configure.ac \
            src/miner.cpp \
            src/init.cpp \
            src/validation.h \
            src/wallet/rpcwallet.cpp \
            src/Makefile.am \
            doc/RIP-0025-PQ-Signatures.md \
            src/policy/policy.cpp \
            src/wallet/wallet.cpp \
            src/crypto/mldsa.cpp \
            src/Makefile.test.include \
            src/chainparams.cpp \
            contrib/devtools/check-rip25-v48-invariants.sh \
            .github/workflows/rip25-v48-final-gate.yml \
            .github/workflows/build-raven.yml

          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git status --short
          git commit -m "security: remediate GLM RIP-25 v4.8 audit findings"
          git push origin HEAD:fix/rip25-v48-glm-remediation
