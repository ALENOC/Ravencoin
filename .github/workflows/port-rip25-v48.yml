name: Port RIP-25 onto v4.8.0

on:
  push:
    branches:
      - integration/rip25-v4.8.0
    paths:
      - '.github/workflows/port-rip25-v48.yml'

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/rip25-v4.8.0
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge RIP-25 with v4.8.0 conflict preference
        run: |
          git fetch origin feature/rip25-pq-hybrid
          git merge --no-commit --no-ff -Xours origin/feature/rip25-pq-hybrid

      - name: Pin liboqs 0.12.0 archive
        run: |
          curl -fsSL --retry 4 --retry-delay 2 \
            https://github.com/open-quantum-safe/liboqs/archive/refs/tags/0.12.0.tar.gz \
            -o /tmp/liboqs-0.12.0.tar.gz
          LIBOQS_SHA256=$(sha256sum /tmp/liboqs-0.12.0.tar.gz | awk '{print $1}')
          python3 - "$LIBOQS_SHA256" <<'PY'
          from pathlib import Path
          import sys
          p = Path('depends/packages/liboqs.mk')
          s = p.read_text()
          old = '$(package)_sha256_hash=TODO_REPLACE_WITH_ACTUAL_HASH'
          if old not in s:
              raise SystemExit('liboqs checksum placeholder not found; refusing ambiguous port')
          s = s.replace(old, '$(package)_sha256_hash=' + sys.argv[1])
          p.write_text(s)
          print('Pinned liboqs SHA256:', sys.argv[1])
          PY

      - name: Apply consensus and security hardening
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()
          def write(path, data):
              Path(path).write_text(data)
          def req(cond, msg):
              if not cond:
                  raise SystemExit(msg)
          def repl(path, old, new, count=None):
              s = read(path)
              n = s.count(old)
              if count is not None:
                  req(n == count, f'{path}: expected {count} occurrences, found {n}: {old[:80]}')
              else:
                  req(n > 0, f'{path}: required pattern missing: {old[:80]}')
              write(path, s.replace(old, new))

          # --- BIP9 / chainparams: preserve 4.8 transfer fix on bit 11, move RIP-25 to bit 12.
          p = 'src/chainparams.cpp'
          s = read(p)
          req('DEPLOYMENT_TRANSFER_OVERFLOW].bit = 11' in s, '4.8 transfer_overflow bit 11 missing')
          req('DEPLOYMENT_PQ_HYBRID' in s, 'RIP-25 deployment missing after merge')
          s = s.replace('DEPLOYMENT_PQ_HYBRID].bit = 11', 'DEPLOYMENT_PQ_HYBRID].bit = 12')
          s = re.sub(r'^\s*consensus\.nPQHybridEnabled\s*=\s*(?:true|false);.*\n', '', s, flags=re.M)
          s = s.replace('Post-Quantum Hybrid Signatures (ECDSA + ML-DSA-44)', 'Post-Quantum Signatures (ML-DSA-44 witness v2)')
          write(p, s)
          req(read(p).count('DEPLOYMENT_PQ_HYBRID].bit = 12') >= 3, 'PQ bit 12 not configured on all networks')

          # --- Deployment enum: both v4.8 and RIP-25 must coexist.
          p = 'src/consensus/params.h'
          s = read(p)
          if 'DEPLOYMENT_PQ_HYBRID' not in s:
              anchor = '    DEPLOYMENT_TRANSFER_OVERFLOW,   // Deployment of asset transfer qty overflow check   \n'
              req(anchor in s, 'cannot locate transfer_overflow enum anchor')
              s = s.replace(anchor, anchor + '    DEPLOYMENT_PQ_HYBRID,        // RIP-25: ML-DSA-44 witness v2\n')
          s = re.sub(r'^\s*bool nPQHybridEnabled;.*\n', '', s, flags=re.M)
          write(p, s)

          # --- VersionBits metadata must match enum order.
          p = 'src/versionbits.cpp'
          s = read(p)
          if '"pq_hybrid"' not in s:
              old = '''    {
        /*.name =*/ "transfer_overflow",
        /*.gbt_force =*/ true,
     }
};'''
              new = '''    {
        /*.name =*/ "transfer_overflow",
        /*.gbt_force =*/ true,
    },
    {
        /*.name =*/ "pq_hybrid",
        /*.gbt_force =*/ true,
    }
};'''
              req(old in s, 'cannot locate transfer_overflow VersionBits entry')
              s = s.replace(old, new)
          write(p, s)

          # --- Remove the per-translation-unit activation cache bug.
          p = 'src/consensus/consensus.h'
          s = read(p)
          s = re.sub(r'^.*fPQHybridIsActive.*\n', '', s, flags=re.M)
          req('MAX_BLOCK_WEIGHT_RIP25_PHASE1' in s, 'RIP-25 block weight constants missing after merge')
          write(p, s)

          # Context-free APIs expose only the maximum structurally supported size.
          # Exact pre/post activation limits are enforced contextually in validation.cpp.
          write('src/consensus/consensus.cpp', '''// Copyright (c) 2017-2019 The Raven Core developers
// Distributed under the MIT software license, see the accompanying
// file COPYING or http://www.opensource.org/licenses/mit-license.php.

#include "consensus.h"

unsigned int GetMaxBlockWeight()
{
    // Structural upper bound supported by this binary. The active consensus
    // limit (8 MWU before RIP-25, 12 MWU after activation) is enforced using
    // VersionBits and pindexPrev in contextual validation.
    return MAX_BLOCK_WEIGHT_RIP25_PHASE1;
}

unsigned int GetMaxBlockSerializedSize()
{
    // Buffer/import upper bound. Consensus block weight remains contextual.
    return MAX_BLOCK_SERIALIZED_SIZE_RIP25_PHASE1;
}
''')

          # --- Do not globally enable a future soft-fork script flag in policy.
          p = 'src/policy/policy.h'
          s = read(p)
          s = s.replace('                                                         SCRIPT_VERIFY_WITNESS_PUBKEYTYPE |\n                                                         SCRIPT_VERIFY_PQ_HYBRID;',
                        '                                                         SCRIPT_VERIFY_WITNESS_PUBKEYTYPE;')
          s = s.replace('bool IsStandard(const CScript& scriptPubKey, txnouttype& whichType, const bool witnessEnabled = false);',
                        'bool IsStandard(const CScript& scriptPubKey, txnouttype& whichType, const bool witnessEnabled = false, const bool pqEnabled = false);')
          s = s.replace('bool IsStandardTx(const CTransaction& tx, std::string& reason, const bool witnessEnabled = false);',
                        'bool IsStandardTx(const CTransaction& tx, std::string& reason, const bool witnessEnabled = false, const bool pqEnabled = false);')
          write(p, s)

          p = 'src/policy/policy.cpp'
          s = read(p)
          s = s.replace('bool IsStandard(const CScript& scriptPubKey, txnouttype& whichType, const bool witnessEnabled) {',
                        'bool IsStandard(const CScript& scriptPubKey, txnouttype& whichType, const bool witnessEnabled, const bool pqEnabled) {')
          s = s.replace('else if (whichType == TX_WITNESS_V2_PQ_KEYHASH)\n        return true; // RIP-25: PQ witness v2 outputs are always standard when solved',
                        'else if (whichType == TX_WITNESS_V2_PQ_KEYHASH)\n        return pqEnabled; // Only standard after the RIP-25 deployment is ACTIVE')
          s = s.replace('bool IsStandardTx(const CTransaction& tx, std::string& reason, const bool witnessEnabled)',
                        'bool IsStandardTx(const CTransaction& tx, std::string& reason, const bool witnessEnabled, const bool pqEnabled)')
          s = s.replace('::IsStandard(txout.scriptPubKey, whichType, witnessEnabled)',
                        '::IsStandard(txout.scriptPubKey, whichType, witnessEnabled, pqEnabled)')
          # Security hardening: no extra consensus weight discount based only on witness-stack shape.
          s = s.replace('(3732 / PQ_WITNESS_SCALE_FACTOR)', '(3732 / WITNESS_SCALE_FACTOR)')
          write(p, s)

          # --- Restore unambiguous transaction weight accounting.
          p = 'src/consensus/validation.h'
          s = read(p)
          pattern = re.compile(r'static inline int64_t GetTransactionWeight\(const CTransaction& tx\)\n\{.*?\n\}', re.S)
          replacement = '''static inline int64_t GetTransactionWeight(const CTransaction& tx)
{
    // RIP-25 deliberately keeps the standard SegWit weight formula. An earlier
    // draft inferred a PQ discount from witness stack sizes alone; that was
    // ambiguous before activation and for future witness versions.
    return ::GetSerializeSize(tx, SER_NETWORK, PROTOCOL_VERSION | SERIALIZE_TRANSACTION_NO_WITNESS) * (WITNESS_SCALE_FACTOR - 1) + ::GetSerializeSize(tx, SER_NETWORK, PROTOCOL_VERSION);
}'''
          s, n = pattern.subn(replacement, s, count=1)
          req(n == 1, 'could not replace GetTransactionWeight safely')
          s = s.replace('// RIP-25: PQ witness v2 data receives an additional discount.\n// Standard segwit witness: 1 WU per byte (4x discount vs non-witness).\n// PQ witness v2: WITNESS_SCALE_FACTOR/PQ_WITNESS_SCALE_FACTOR = 0.5 WU per byte (8x discount).\n// Discount per PQ witness byte = 1 - 4/8 = 0.5 WU.\n',
                        '// RIP-25 uses the standard SegWit witness weight formula (4x witness discount).\n')
          write(p, s)

          # --- Fail closed for deterministic key generation.
          p = 'src/crypto/mldsa.cpp'
          s = read(p)
          old = '''    // If internal symbols are not available, fall back to random keygen.
    // Deterministic keygen from seed is not supported in this liboqs build.
    return KeyGenRandom(pk, sk);'''
          new = '''    // Deterministic derivation must never silently become random: doing so would
    // make the same seed produce different wallet keys across platforms/builds.
    // Fail closed if this liboqs build does not expose deterministic ML-DSA-44 keygen.
    return false;'''
          req(old in s, 'deterministic keygen fallback pattern missing')
          write(p, s.replace(old, new))

          # --- Advertise software capability, not activation state.
          p = 'src/init.cpp'
          s = read(p)
          s = s.replace('''    // RIP-25: Advertise post-quantum support
    if(chainparams.GetConsensus().nPQHybridEnabled) {
        nLocalServices = ServiceFlags(nLocalServices | NODE_PQ_HYBRID);
    }''',
                        '''    // RIP-25: advertise that this binary understands ML-DSA-44 witness v2.
    // This service bit is capability signalling only; consensus activation is BIP9-driven.
    nLocalServices = ServiceFlags(nLocalServices | NODE_PQ_HYBRID);''')
          write(p, s)

          # --- Contextual activation and reorg-safe consensus limits.
          p = 'src/validation.h'
          s = read(p)
          if 'bool IsPQHybridActive(const CBlockIndex* pindexPrev' not in s:
              anchor = '/** RIP-25: Check if Post-Quantum Hybrid Signatures are deployed */\nbool IsPQHybridDeployed();'
              req(anchor in s, 'validation.h PQ deployment declaration missing')
              s = s.replace(anchor, '''/** RIP-25: deployment state for the block after pindexPrev. */
bool IsPQHybridActive(const CBlockIndex* pindexPrev, const Consensus::Params& params);
/** Active consensus block-weight limit for the block after pindexPrev. */
unsigned int GetMaxBlockWeightForPrev(const CBlockIndex* pindexPrev, const Consensus::Params& params);
/** RIP-25: Check deployment state at the active chain tip. */
bool IsPQHybridDeployed();''')
          write(p, s)

          p = 'src/validation.cpp'
          s = read(p)
          req('VersionBitsCache versionbitscache;' in s, 'VersionBits cache definition missing')
          if 'bool IsPQHybridActive(const CBlockIndex* pindexPrev' not in s:
              anchor = 'VersionBitsCache versionbitscache;\n'
              helper = '''VersionBitsCache versionbitscache;

bool IsPQHybridActive(const CBlockIndex* pindexPrev, const Consensus::Params& params)
{
    LOCK(cs_main);
    return VersionBitsState(pindexPrev, params, Consensus::DEPLOYMENT_PQ_HYBRID, versionbitscache) == THRESHOLD_ACTIVE;
}

unsigned int GetMaxBlockWeightForPrev(const CBlockIndex* pindexPrev, const Consensus::Params& params)
{
    return IsPQHybridActive(pindexPrev, params) ? MAX_BLOCK_WEIGHT_RIP25_PHASE1 : MAX_BLOCK_WEIGHT_RIP2;
}
'''
              s = s.replace(anchor, helper, 1)

          old = '''    // RIP-25: Start enforcing post-quantum hybrid signature rules
    if (consensusparams.nPQHybridEnabled) {
        flags |= SCRIPT_VERIFY_PQ_HYBRID;
    }'''
          new = '''    // RIP-25: enforce ML-DSA-44 witness v2 only after BIP9 activation.
    if (pindex && IsPQHybridActive(pindex->pprev, consensusparams)) {
        flags |= SCRIPT_VERIFY_PQ_HYBRID;
    }'''
          if old in s:
              s = s.replace(old, new, 1)
          req('consensusparams.nPQHybridEnabled' not in s, 'static PQ activation boolean survived in validation.cpp')

          # Gate standard output creation/relay and script verification on the same BIP9 state.
          old = '    bool witnessEnabled = IsWitnessEnabled(chainActive.Tip(), chainparams.GetConsensus());\n'
          req(old in s, 'mempool witness activation anchor missing')
          if 'bool pqEnabled = IsPQHybridActive(chainActive.Tip()' not in s:
              s = s.replace(old, old + '    bool pqEnabled = IsPQHybridActive(chainActive.Tip(), chainparams.GetConsensus());\n', 1)
          s = s.replace('IsStandardTx(tx, reason, witnessEnabled)', 'IsStandardTx(tx, reason, witnessEnabled, pqEnabled)', 1)
          old = '        unsigned int scriptVerifyFlags = STANDARD_SCRIPT_VERIFY_FLAGS;\n'
          req(old in s, 'mempool script flags anchor missing')
          if 'scriptVerifyFlags |= SCRIPT_VERIFY_PQ_HYBRID' not in s[s.index(old):s.index(old)+500]:
              s = s.replace(old, old + '        if (pqEnabled)\n            scriptVerifyFlags |= SCRIPT_VERIFY_PQ_HYBRID;\n', 1)

          # Enforce 8 MWU pre-activation / 12 MWU post-activation with the candidate chain context.
          sig = '''static bool ContextualCheckBlock(const CBlock& block, CValidationState& state, const Consensus::Params& consensusParams, const CBlockIndex* pindexPrev, CAssetsCache* assetCache)
{
    const int nHeight = pindexPrev == nullptr ? 0 : pindexPrev->nHeight + 1;
'''
          req(sig in s, 'ContextualCheckBlock anchor missing')
          if 'bad-blk-pq-weight' not in s:
              s = s.replace(sig, sig + '''
    const unsigned int nContextualMaxBlockWeight = GetMaxBlockWeightForPrev(pindexPrev, consensusParams);
    if (GetBlockWeight(block) > nContextualMaxBlockWeight) {
        return state.DoS(100, false, REJECT_INVALID, "bad-blk-pq-weight", false,
                         strprintf("contextual block weight %d exceeds active limit %u",
                                   GetBlockWeight(block), nContextualMaxBlockWeight));
    }
''', 1)

          # Tip helper: no sticky global cache; reorgs are handled by VersionBitsState.
          pattern = re.compile(r'/\*\* RIP-25: Post-Quantum Hybrid Signatures deployment check \*/\nbool IsPQHybridDeployed\(\)\n\{.*?\n\}', re.S)
          replacement = '''/** RIP-25: Post-Quantum Signatures deployment check */
bool IsPQHybridDeployed()
{
    LOCK(cs_main);
    return VersionBitsState(chainActive.Tip(), GetParams().GetConsensus(), Consensus::DEPLOYMENT_PQ_HYBRID, versionbitscache) == THRESHOLD_ACTIVE;
}'''
          s, n = pattern.subn(replacement, s, count=1)
          req(n == 1, 'could not replace IsPQHybridDeployed safely')
          write(p, s)

          # Miner may use the structural 12 MWU ceiling in options, but is clamped to active consensus at the tip.
          p = 'src/miner.cpp'
          s = read(p)
          anchor = '    CBlockIndex* pindexPrev = chainActive.Tip();\n    assert(pindexPrev != nullptr);\n    nHeight = pindexPrev->nHeight + 1;\n'
          req(anchor in s, 'miner pindexPrev anchor missing')
          if 'GetMaxBlockWeightForPrev(pindexPrev' not in s:
              s = s.replace(anchor, anchor + '''    nBlockMaxWeight = std::min<size_t>(nBlockMaxWeight,
        GetMaxBlockWeightForPrev(pindexPrev, chainparams.GetConsensus()) - 4000);
''', 1)
          write(p, s)

          # Documentation: the old 8x discount is superseded by this hardened v4.8 port.
          p = 'doc/RIP-0025-PQ-Signatures.md'
          if Path(p).exists():
              s = read(p)
              note = '''\n> **Security hardening for the Ravencoin Core 4.8.0 port:** the additional RIP-25-specific 8x witness discount described in the original draft is disabled. The implementation uses standard SegWit weight accounting (4x witness discount). This avoids pre-activation/future-witness ambiguity. BIP9 bit 12 is used; bit 11 belongs to `DEPLOYMENT_TRANSFER_OVERFLOW` in Core 4.8.0.\n\n'''
              if 'Security hardening for the Ravencoin Core 4.8.0 port' not in s:
                  marker = 'License: MIT\n```\n'
                  req(marker in s, 'RIP-25 document header marker missing')
                  s = s.replace(marker, marker + note, 1)
              s = s.replace('BIP9 bit 11', 'BIP9 bit 12').replace('bit **11**', 'bit **12**')
              write(p, s)

          # --- Non-negotiable 4.8 + RIP-25 invariants.
          combined = '\n'.join(Path(x).read_text() for x in [
              'src/chainparams.cpp','src/consensus/params.h','src/validation.cpp',
              'src/policy/policy.h','depends/packages/liboqs.mk'])
          req('nHeightHeaderCheckActivation = 4487776' in read('src/chainparams.cpp'), '4.8 header-height activation lost')
          req('4487775' in read('src/chainparams.cpp'), '4.8 checkpoint 4487775 lost')
          req('DEPLOYMENT_TRANSFER_OVERFLOW].bit = 11' in read('src/chainparams.cpp'), '4.8 bit 11 lost')
          req('DEPLOYMENT_PQ_HYBRID].bit = 12' in read('src/chainparams.cpp'), 'RIP-25 bit 12 missing')
          req('bad-blk-height' in read('src/validation.cpp'), '4.8 bad-blk-height protection lost')
          req('TODO_REPLACE_WITH_ACTUAL_HASH' not in combined, 'liboqs checksum still placeholder')
          req('fPQHybridIsActive' not in combined, 'unsafe sticky/static PQ activation state remains')
          req('nPQHybridEnabled' not in combined, 'static PQ activation config remains')
          req('SCRIPT_VERIFY_PQ_HYBRID;' not in read('src/policy/policy.h').split('STANDARD_SCRIPT_VERIFY_FLAGS',1)[1].split('STANDARD_NOT_MANDATORY',1)[0], 'PQ script flag is globally enabled in standard policy')
          print('RIP-25 v4.8 hardening invariants: PASS')
          PY

      - name: Record hardened port
        run: |
          git status --short
          git add -A
          git commit -m "RIP-25: port onto v4.8.0 and harden consensus activation"
          git push origin HEAD:integration/rip25-v4.8.0
