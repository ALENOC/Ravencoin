name: Build Raven

on:
  push:
    branches:
      - fix/rip25-v48-glm-remediation
  workflow_dispatch:

permissions:
  contents: read

env:
  SCRIPTS: ${{ GITHUB.WORKSPACE }}/.github/scripts

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    strategy:
      fail-fast: false
      matrix:
       OS: [ 'windows', 'osx' ]

#&&&&&& Beginning- section to free up space on root for the builds and for 30GB of swap
    steps:
    - name: Print Original Available Memory and Storage
      shell: bash
      run: |
        echo "Original Available Memory and Storage:"
        free -h
        echo
        swapon --show
        echo
        df -vh
        echo

    - name: Delete Unwanted Software
      shell: bash
      run: |
        echo "Removing Unwanted Software"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Print Available Memory and Storage after Unwanted Software Removal
      shell: bash
      run: |
        echo "Original Available Memory and Storage after Unwanted Software Removal:"
        free -h
        echo
        swapon --show
        echo
        df -vh
        echo

#     We use a SWAP_FILE variable because some runner VMs allocate /swapfile and some use /mnt/swapfile
    - name: Delete the existing swap
      shell: bash
      run: |
        export SWAP_FILE=$(swapon --show=NAME | tail -n 1)
        sudo swapoff "${SWAP_FILE}"
        sudo rm "${SWAP_FILE}"

    - name: Print Available Memory and Storage after Deleting Swap
      shell: bash
      run: |
        echo "Available Memory and Storage after Deleting Swap:"
        free -h
        echo
        swapon --show
        echo
        df -vh
        echo

    - name: Allocate swap on root
      shell: bash
      run: |
        sudo fallocate -l 30G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Print Finnal Available Memory and Storage
      shell: bash
      run: |
        echo "Final Available Memory and Storage:"
        free -h
        echo
        swapon --show
        echo
        df -vh
        echo
#&&&&&& End- section to free up space on root for the builds and for 30GB of swap

    - name: Checkout the Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify Checked-Out Commit Is Pristine
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git status --porcelain)"

    - name: Verify Security and Consensus Invariants
      shell: bash
      run: ./contrib/devtools/check-rip25-v48-invariants.sh --structural-only

    - name: Install Build Tools
      run: sudo bash -Eeuo pipefail "${SCRIPTS}/00-install-deps.sh" "${{ matrix.OS }}"

    # Release dependencies are rebuilt from pinned recipes. Restoring compiled
    # depends state would make artifact contents depend on unauthenticated cache.
    - name: Build Dependencies
      run: bash -Eeuo pipefail "${SCRIPTS}/02-copy-build-dependencies.sh" "${{ matrix.OS }}" "$GITHUB_WORKSPACE" "$GITHUB_REF"

    - name: Add Dependencies to the System PATH
      shell: bash
      run: |
        if [[ "${{ matrix.OS }}" == "windows" ]]; then
          echo "$GITHUB_WORKSPACE/depends/x86_64-w64-mingw32/native/bin" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/depends/x86_64-apple-darwin14/native/bin" >> "$GITHUB_PATH"
        fi

    - name: Build Config
      run: |
        ./autogen.sh
        mkdir -p "$HOME/.ccache"

    - name: Configure Build
      run: bash -Eeuo pipefail "${SCRIPTS}/04-configure-build.sh" "${{ matrix.OS }}" "$GITHUB_WORKSPACE"

    - name: Verify Tracked Source Remains Unchanged
      shell: bash
      run: |
        git diff --exit-code
        git diff --cached --exit-code

    - name: Build Raven
      run: make -j2

# Skip the binary checks for now.
#      name: Check Binary Security
#      run: ${SCRIPTS}/05-binary-checks.sh ${{ MATRIX.OS }} ${{ GITHUB.WORKSPACE }}

    - name: Package Up the Build
      run: bash -Eeuo pipefail "${SCRIPTS}/06-package.sh" "${{ matrix.OS }}" "$GITHUB_WORKSPACE" "${{ github.base_ref || github.ref_name }}"
    
    - name: Upload Artifacts to Job
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: raven-${{ matrix.OS }}-${{ github.sha }}
        path: ${{ github.workspace }}/release
        if-no-files-found: error
        retention-days: 14
